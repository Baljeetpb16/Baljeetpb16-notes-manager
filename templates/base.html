<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}NoteNest{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<style>
body{
background:#f5f7fb;
}

.sidebar{
height:100vh;
background:white;
border-right:1px solid #e5e7eb;
padding-top:20px;
}

.sidebar a{
display:block;
padding:10px 20px;
text-decoration:none;
color:#333;
font-weight:500;
}

.sidebar a:hover{
background:#f1f3f5;
}

.sidebar .active{
background:#0d6efd;
color:white;
border-radius:6px;
margin:4px;
}

.main{
padding:30px;
}

.brand{
font-size:20px;
font-weight:700;
padding-left:20px;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container-fluid">
<div class="row">

{% if user.is_authenticated %}

<div class="col-md-2 sidebar">

<div class="brand">
<i class="bi bi-journal-bookmark-fill"></i> NoteNest
</div>

<a href="{% url 'dashboard' %}">
<i class="bi bi-speedometer2"></i> Dashboard
</a>

<a href="{% url 'notes:list' %}">
<i class="bi bi-file-earmark-text"></i> Notes
</a>

<a href="{% url 'assignments:list' %}">
<i class="bi bi-check2-square"></i> Assignments
</a>

<form method="post" action="{% url 'accounts:logout' %}">
{% csrf_token %}
<button class="btn btn-danger m-3 w-75">
<i class="bi bi-box-arrow-right"></i> Logout
</button>
</form>

</div>

<div class="col-md-10 main">

{% else %}

<div class="col-md-12 main">

{% endif %}

{% if messages %}
{% for message in messages %}

<div class="alert alert-{{ message.tags }} alert-dismissible fade show">
{{ message }}
<button class="btn-close" data-bs-dismiss="alert"></button>
</div>

{% endfor %}
{% endif %}

{% block content %}{% endblock %}

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
